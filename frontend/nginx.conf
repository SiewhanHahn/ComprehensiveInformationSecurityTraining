server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trial files are streamed to the API rather than spooled to proxy temp files.
    location = /api/v1/replay/trial {
        client_max_body_size 256k;
        client_body_buffer_size 256k;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        error_page 413 = @trial_too_large;
    }

    location @trial_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"TRIAL_TOO_LARGE","message":"File exceeds 256 KiB","request_id":"$request_id"}}';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
